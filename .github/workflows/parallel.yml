name: Parallel Checks Workflow

on:
    push:
        branches: [main]
    workflow_dispatch:

jobs:
    lint:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v3
            
            - name: Run lint check
              run: |
                echo "Running lint check"
                sleep 3
                echo "Lint check complete"

    security-scan:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v3
            
            - name: Run security scan
              run: |
                echo "Running security scan"
                sleep 3
                echo "Security scan complete, no vulnerabilities found"
    
    unit-test:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v3
            
            - name: Run unit tests
              run: |
                echo "Running unit tests"
                sleep 3
                echo "Unit tests complete"
    
    summary:
        runs-on: ubuntu-latest
        needs: [lint, security-scan, unit-test]
        if: always()
        steps:
            - name: print summary
              run: |
               echo "Lint result: ${{ needs.lint.result }}"
               echo "Security scan result: ${{ needs.security-scan.result }}"
               echo "Unit test result: ${{ needs.unit-test.result }}"